[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyops-ai-video-adherence-gate"
version = "1.0.1"
description = "xyOps Event Plugin: post-render AI-video quality gate (motion, morph, lip-sync) via AIVideoAdherenceGate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "madebysaira" }]
keywords = ["xyops", "ai-video", "quality-gate", "ffmpeg", "plugin"]

[project.scripts]
ai-video-adherence-gate = "xyops_ai_video_adherence_gate.plugin:main_cli"

[tool.setuptools]
packages = [
    "xyops_ai_video_adherence_gate",
    "xyops_ai_video_adherence_gate.vendor",
    "xyops_ai_video_adherence_gate.vendor.adherencegate",
]
